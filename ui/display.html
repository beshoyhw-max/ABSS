<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absence Tracker — Display</title>
    <link rel="stylesheet" href="css/display.css">
</head>
<body class="pywebview-drag-region">
    <div id="floating-bar">
        <div id="drag-bar">
            <span id="drag-hint">⋮⋮</span>
            <span id="meeting-date"></span>
            <span id="current-time"></span>
        </div>
        <div class="absences-list no-drag" id="absences-list">
            <p class="all-present">✓ Everyone is present</p>
        </div>
    </div>
    <!-- Custom Resize Handle in the bottom-right corner -->
    <div id="resize-handle" class="no-drag"></div>
    <script src="js/display.js"></script>
</body>
</html>
